server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hotel_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-in-production-minimum-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.default-admin.email=${DEFAULT_ADMIN_EMAIL:admin@hotel.com}
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD:Admin123!}
app.default-admin.full-name=${DEFAULT_ADMIN_NAME:Sistem Yoneticisi}

iyzico.api-key=${IYZICO_API_KEY:sandbox-api-key}
iyzico.secret-key=${IYZICO_SECRET_KEY:sandbox-secret-key}
iyzico.base-url=${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
